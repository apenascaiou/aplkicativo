name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Criar chave de assinatura (só na primeira vez)
        run: |
          if [ ! -f launcher.jks ]; then
            keytool -genkeypair -keystore launcher.jks -storepass launcherleve -keypass launcherleve \
              -alias launcher -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Launcher Leve"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add launcher.jks
            git commit -m "Adiciona chave de assinatura [skip ci]"
            git push
          fi
      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon
      - name: Publicar APK na release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk LauncherLeve.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest LauncherLeve.apk -t "Launcher Leve" -n "Build ${GITHUB_SHA::7}"
